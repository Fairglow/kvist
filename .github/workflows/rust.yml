name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Run nightly at 04:15 UTC (05:15 CET / 06:15 CEST)
    - cron: "15 4 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  quality:
    name: Quality (Linux, stable)
    runs-on: ubuntu-latest
    # The sandbox runner must be installed outside the VCS worktree for the
    # offline cargo verification e2e test to execute it, so build there.
    env:
      CARGO_TARGET_DIR: /home/runner/kvist-target

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install and configure Bubblewrap
        run: |
          sudo apt-get update -y && sudo apt-get install -y --no-install-recommends bubblewrap python3 nodejs gcc g++
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          fi
          sudo chmod u+s /usr/bin/bwrap || true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Expose trusted system rustup for sandbox preparation
        run: |
          if [ ! -x /usr/bin/rustup ]; then
            sudo install -m 0755 "$(command -v rustup)" /usr/bin/rustup
          fi

      - name: Provision native Rust inventory test coverage
        run: |
          # Provision on the CI host, never from a sandbox or test body.
          rustup toolchain install 1.95.0 --profile minimal --no-self-update
          rustup target add wasm32-unknown-unknown --toolchain stable

      - name: Install system Go toolchain
        run: |
          # The offline language e2e tests verify against a go toolchain whose
          # GOROOT lives under a sandboxed system prefix (/usr, /lib, /lib64,
          # /bin, /sbin); the runner's toolcache go that leads PATH does not,
          # so install the official tarball at /usr/local/go and expose it as
          # /usr/bin/go. The version must be >= the go directive in the e2e
          # fixture (go 1.24), or the sandboxed build fails with an actionable
          # go.mod requirement error.
          curl -fsSL https://go.dev/dl/go1.24.13.linux-amd64.tar.gz | sudo tar -C /usr/local -xz
          sudo ln -sf /usr/local/go/bin/go /usr/bin/go

      - name: Cache cargo registry and build target
        uses: Swatinem/rust-cache@v2

      - name: Verify formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Build workspace (debug)
        run: cargo build --locked --workspace --all-targets --all-features

      - name: Test workspace
        run: cargo test --locked --workspace --all-features

      - name: Test the native Rust sandbox chain
        run: |
          KVIST_RUST_TEST_RUNNER="$CARGO_TARGET_DIR/debug/galla-runner" \
            cargo test --locked -p skott --test rust_build_environment -- \
            --include-ignored --test-threads=1 --nocapture \
            --skip cargo_installed_tools_are_available_in_sandbox \
            --skip installed_minimal_pin_builds_without_optional_components \
            --skip native_repository_tests_execute_inside_the_workspace_sandbox
          KVIST_GALLA="$CARGO_TARGET_DIR/debug/galla-runner" \
            cargo test --locked -p kvist --test sandbox_toolchain -- \
            --include-ignored --test-threads=1 --nocapture

      - name: Test native Galla toolchain execution and rustup inventory parity
        run: |
          KVIST_GALLA="$CARGO_TARGET_DIR/debug/galla-runner" \
            cargo test --locked -p galla --test toolchain_e2e -- \
            --ignored --test-threads=1 --nocapture

  audit:
    name: Dependencies and licenses
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Audit advisories, bans, licenses, and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          arguments: --all-features --locked
          command-arguments: advisories bans licenses sources

  msrv:
    name: MSRV (Rust 1.95.0)
    runs-on: ubuntu-latest
    # Build outside the worktree so the sandbox runner the offline cargo
    # verification e2e test executes stays outside the VCS worktree.
    env:
      CARGO_TARGET_DIR: /home/runner/kvist-target

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install and configure Bubblewrap
        run: |
          sudo apt-get update -y && sudo apt-get install -y --no-install-recommends bubblewrap
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          fi
          sudo chmod u+s /usr/bin/bwrap || true

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Install system Go toolchain
        run: |
          # The offline language e2e tests verify against a go toolchain whose
          # GOROOT lives under a sandboxed system prefix (/usr, /lib, /lib64,
          # /bin, /sbin); the runner's toolcache go that leads PATH does not,
          # so install the official tarball at /usr/local/go and expose it as
          # /usr/bin/go. The version must be >= the go directive in the e2e
          # fixture (go 1.24), or the sandboxed build fails with an actionable
          # go.mod requirement error.
          curl -fsSL https://go.dev/dl/go1.24.13.linux-amd64.tar.gz | sudo tar -C /usr/local -xz
          sudo ln -sf /usr/local/go/bin/go /usr/bin/go

      - name: Cache cargo registry and build target
        uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --locked --workspace --all-features

      - name: Build workspace (debug)
        run: cargo build --locked --workspace --all-targets --all-features

      - name: Test workspace
        run: cargo test --locked --workspace --all-features

  vcs:
    name: VCS tracking (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build target
        uses: Swatinem/rust-cache@v2

      - name: Install jj 0.44.0
        run: cargo install --locked --version 0.44.0 jj-cli

      - name: Test Git and jj tracking
        run: cargo test -p kvist --locked --test vcs

  release:
    name: Release build (Ubuntu 22.04)
    # Use ubuntu-22.04 for the oldest supported glibc baseline (glibc 2.35)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build target
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --locked --workspace --release --all-features

      - name: Upload release binaries artifact
        uses: actions/upload-artifact@v4
        with:
          name: kvist-linux-x86_64
          path: |
            target/release/kvist
            target/release/galla-runner
            target/release/sav-run
          retention-days: 7
          if-no-files-found: error
