name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality (Linux, stable)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Verify lockfile and formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test workspace
        run: cargo test --locked --workspace
      - name: Release build
        run: cargo build --locked --workspace --release

  msrv:
    name: MSRV (Rust 1.85.0)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Check
        run: cargo check --locked --workspace
      - name: Test
        run: cargo test --locked --workspace

  vcs:
    name: VCS tracking (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install jj 0.44.0
        run: cargo install --locked --version 0.44.0 jj-cli
      - name: Test Git and jj tracking
        run: cargo test --locked --test vcs
