name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Run nightly at 04:15 UTC (05:15 CET / 06:15 CEST)
    - cron: "15 4 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  quality:
    name: Quality (Linux, stable)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bubblewrap
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends bubblewrap

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build target
        uses: Swatinem/rust-cache@v2

      - name: Verify formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Build workspace (debug)
        run: cargo build --locked --workspace --all-targets --all-features

      - name: Install sandbox runner outside worktree
        run: |
          sudo install -m 0755 target/debug/kvist-sandbox-runner /usr/local/bin/kvist-sandbox-runner
          echo "KVIST_SANDBOX_RUNNER_TEST_BIN=/usr/local/bin/kvist-sandbox-runner" >> "$GITHUB_ENV"

      - name: Test workspace
        run: cargo test --locked --workspace --all-features

  audit:
    name: Dependencies and licenses
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Audit advisories, bans, licenses, and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          arguments: --all-features --locked
          command-arguments: advisories bans licenses sources

  msrv:
    name: MSRV (Rust 1.94.0)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bubblewrap
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends bubblewrap

      - name: Install Rust 1.94.0
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Cache cargo registry and build target
        uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --locked --workspace --all-features

      - name: Build workspace (debug)
        run: cargo build --locked --workspace --all-targets --all-features

      - name: Install sandbox runner outside worktree
        run: |
          sudo install -m 0755 target/debug/kvist-sandbox-runner /usr/local/bin/kvist-sandbox-runner
          echo "KVIST_SANDBOX_RUNNER_TEST_BIN=/usr/local/bin/kvist-sandbox-runner" >> "$GITHUB_ENV"

      - name: Test workspace
        run: cargo test --locked --workspace --all-features

  vcs:
    name: VCS tracking (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build target
        uses: Swatinem/rust-cache@v2

      - name: Install jj 0.44.0
        run: cargo install --locked --version 0.44.0 jj-cli

      - name: Test Git and jj tracking
        run: cargo test -p kvist --locked --test vcs

  release:
    name: Release build (Ubuntu 22.04)
    # Use ubuntu-22.04 for the oldest supported glibc baseline (glibc 2.35)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build target
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --locked --workspace --release --all-features

      - name: Upload release binaries artifact
        uses: actions/upload-artifact@v4
        with:
          name: kvist-linux-x86_64
          path: |
            target/release/kvist
            target/release/kvist-sandbox-runner
            target/release/agent-run
          retention-days: 7
          if-no-files-found: error
