name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  quality:
    name: Quality (Linux, stable)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Verify lockfile and formatting
        run: cargo fmt --manifest-path engine/Cargo.toml --check
      - name: Lint
        run: cargo clippy --manifest-path engine/Cargo.toml --workspace --all-targets --all-features -- -D warnings
      - name: Test workspace
        run: cargo test --manifest-path engine/Cargo.toml --locked --workspace --all-features
      - name: Release build
        run: cargo build --manifest-path engine/Cargo.toml --locked --workspace --release --all-features

  audit:
    name: Dependencies and licenses
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Audit advisories, bans, licenses, and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          arguments: --manifest-path engine/Cargo.toml --all-features --locked
          command-arguments: advisories bans licenses sources

  msrv:
    name: MSRV (Rust 1.94.0)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - name: Check
        run: cargo check --manifest-path engine/Cargo.toml --locked --workspace --all-features
      - name: Test
        run: cargo test --manifest-path engine/Cargo.toml --locked --workspace --all-features

  vcs:
    name: VCS tracking (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install jj 0.44.0
        run: cargo install --locked --version 0.44.0 jj-cli
      - name: Test Git and jj tracking
        run: cargo test --manifest-path engine/Cargo.toml --locked --test vcs
