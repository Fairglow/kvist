name: Publish Blad

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Accepted version, already tagged blad-vVERSION"
        required: true
        type: string
      revision:
        description: "Full commit SHA independently accepted for this release"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-blad
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: blad-crates-io
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/blad-v${{ inputs.version }}
          persist-credentials: false
      - name: Require matching clean release identity
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_REVISION: ${{ inputs.revision }}
        run: |
          python3 -I - <<'PY'
          import os, subprocess, tomllib
          from pathlib import Path
          package = tomllib.loads(Path("blad/Cargo.toml").read_text())["package"]
          if package["name"] != "kvist-blad" or package["version"] != os.environ["RELEASE_VERSION"]:
              raise SystemExit("release input does not match the checked-out package")
          revision = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if revision != os.environ["RELEASE_REVISION"]:
              raise SystemExit("release tag does not match the independently accepted full commit SHA")
          if subprocess.check_output(["git", "status", "--porcelain"]):
              raise SystemExit("release source is not clean")
          PY
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Verify source and exact archive before publishing
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: |
          rustup toolchain install 1.95.0 --profile minimal --no-self-update
          cargo +1.95.0 test --locked -p kvist-blad --no-default-features
          cargo +1.95.0 test --locked -p kvist-blad --all-features
          cargo fmt -p kvist-blad --check
          cargo clippy --locked -p kvist-blad --all-targets --all-features -- -D warnings
          cargo doc --locked -p kvist-blad --all-features --no-deps
          python3 blad/ci/verify_package.py
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          command: check
          manifest-path: blad/Cargo.toml
          arguments: --config deny.toml --all-features --locked
          command-arguments: advisories bans licenses sources
      - name: Publish only the accepted Blad package
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.BLAD_CRATES_IO_TOKEN }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN" || { echo "Configure the protected Blad publishing credential"; exit 1; }
          cargo publish --locked -p kvist-blad --dry-run
          cargo publish --locked -p kvist-blad
      - name: Verify the published registry installation
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          cargo install --locked kvist-blad --version "$RELEASE_VERSION" --root "$RUNNER_TEMP/blad-registry"
          "$RUNNER_TEMP/blad-registry/bin/blad" --version
          "$RUNNER_TEMP/blad-registry/bin/blad" --dump blad/tests/fixtures/component_model.md
