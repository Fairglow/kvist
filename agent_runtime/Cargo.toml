[package]
name = "agent-runtime"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
authors = ["Stefan Lindblad"]
description = "Bounded provider and agent runtime mechanisms for Kvist"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Fairglow/kvist"
homepage = "https://github.com/Fairglow/kvist"

[features]
default = []

[lib]
name = "agent_runtime"

[[bin]]
name = "agent-run"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
hex = { version = "0.4" }
nix = { version = "0.31", default-features = false, features = ["fs", "poll", "process", "signal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11"
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1", features = ["macros", "net", "rt", "time"], optional = true }
toml_edit = "0.25.15"
tracing = "0.1"

[dev-dependencies]
tempfile = "3.27"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
