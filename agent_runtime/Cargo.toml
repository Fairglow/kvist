[package]
name = "agent-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Stefan Lindblad"]
description = "Bounded provider and agent runtime mechanisms for Kvist"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Fairglow/kvist"
homepage = "https://github.com/Fairglow/kvist"

[features]
default = ["rig-transport"]
rig-transport = ["dep:bytes", "dep:futures", "dep:reqwest", "dep:rig-core", "dep:tokio"]

[lib]
name = "agent_runtime"

[[bin]]
name = "agent-run"
path = "src/main.rs"

[dependencies]
bytes = { version = "1", optional = true }
clap = { version = "4.6", features = ["derive"] }
futures = { version = "0.3", optional = true }
hex = "0.4"
nix = { version = "0.31", default-features = false, features = ["fs", "poll", "process", "signal"] }
reqwest = { version = "0.13", default-features = false, optional = true }
rig-core = { version = "=0.42.0", default-features = false, optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11"
signal-hook = "0.3"
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1", features = ["macros", "net", "rt", "time"], optional = true }
toml_edit = "0.25.15"
tracing = "0.1"

[dev-dependencies]
tempfile = "3.27"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
