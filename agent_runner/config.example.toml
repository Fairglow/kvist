# Example agent-runner configuration.
schema_version = 1

# Optional override for the working directory; defaults to the process
# current directory when omitted. Must be absolute and exist.
working_directory = "/absolute/path/to/your/project"

# The provider to query for the currently active model. When the provider has
# an active model that is already loaded, it is reused with no switch. When it
# has none, the provider's default model (is_default = true) is used as the
# fall-back; if there is more than one model for that provider and no active
# model, you are asked to pick one.
default_provider = "llama-server"
default_thinking_effort = "medium"

# UI theme: `dark` (default) keeps the classic black panels; `light` is the
# built-in alternative for light terminals. Both give reasoning a left edge and
# tint, and highlighted code an indentation plus a patch. The --theme flag
# overrides this per run, and Ctrl+S cycles themes live.
theme = "dark"

# Models selectable in the UI with -m/--model.
[[models]]
id = "local"
provider = "llama-server"
base_url = "http://127.0.0.1:9931"
model = "qwen2.5-14b"
# Fall-back model for the default provider, used only when no model is active.
# At most one [[models]] entry per provider may be marked default.
is_default = true
# By default discover the selected model's serving context (not training size).
# Configure this if runtime metadata is absent. CLI overrides take precedence.
# context_limit = 131072
# Initial output bound; default min(8192, context_limit/4). Safe length retries
# may increase it within the context/time/token limits. max_attempts=1 disables retries.
# response_reserve = 8192
# Per-turn generation budget. Long-context turns (large prefill plus thousands
# of generated tokens) can take a couple of minutes; a stalled provider is still
# caught by the slot/TTFT/cadence watchdogs, so this can be generous.
deadline_secs = 300
# Inter-token cadence watchdog: abort and retry a turn that sends no token for
# this many seconds after the first token. `0` disables it.
cadence_timeout_secs = 30

[[models]]
id = "ollama"
provider = "ollama"
base_url = "http://127.0.0.1:11434"
model = "qwen2.5"
# An unloaded Ollama model has no discoverable serving context. Set this to the
# num_ctx actually configured for it, or load it before startup.
# context_limit = 32768
deadline_secs = 300
cadence_timeout_secs = 30

# The independent sandbox enforcement boundary.
[sandbox]
runner = "/usr/local/bin/kvist-sandbox-runner"
backend = "/usr/bin/bwrap"

# Tool policy. The denylist entries below are appended to the built-in safe
# minimum, which already forbids clearly destructive commands.
[tool_policy]
shell_deny_substrings = []
shell_deny_prefixes = []

# Per-language tool-chain advertisement. Each key is a configurable profile id
# (python, rust, javascript, go, c). `Generic` is always present and is not
# configured. `auto` advertises the profile only when its interpreter reaches the
# sandbox; `on` advertises and fails at startup when it does not; `off` never
# advertises. Unknown profile keys and unrecognized settings fail at load.
[tool_profiles]
python = "auto"
rust = "auto"
javascript = "auto"
go = "auto"
c = "auto"
