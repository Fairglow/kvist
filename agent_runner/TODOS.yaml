  - id: "agent-runner-security-audit"
    title: "Audit agent-runner authority"
    description: "Review tool rendering, shell denylist, write-root enforcement, sandbox request construction, environment allowlist, fail-closed execution, cancellation, and untrusted-input validation for authority escalation, disclosure, or false enforcement."
    context: >-
      Internal/implementer review of the authority-critical paths. This is not a
      separate source-blind certification; the independent gate is the
      compliance-review task. Review of sandbox request construction, environment
      allowlist, symlink rejection, overlap detection, network Deny, bounded/
      validated requests, and hashed identities passed with no findings.
    purpose: "Identify high-confidence paths to authority escalation or disclosure before the tool is trusted in a workspace."
    expected_outcome: >-
      One authority-escalation finding corrected with a regression test: the
      write-file render gate used a bare prefix check on the write root, so a
      sibling such as /workspace-evil was accepted as inside /workspace. Replaced
      with a slash-boundary check (under_write_root) and added two regression
      tests (agent_runner/tests/component_tests.rs). The sandbox enforces the
      write root as a backstop, but the render gate's stated contract of rejecting
      before any sandbox request is built is now honored.
    kind: security-audit
    status: completed
    depends_on:
      - "agent-runner-integration-write-tests"
      - "agent-runner-tui-implement-code"
    requirements:
      - "DESIGN.md#Security-posture"
      - "REQUIREMENTS.md#Constraints"
