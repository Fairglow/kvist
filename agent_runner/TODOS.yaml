    title: "Reconcile remaining documentation drift from the implementation review"
    description: >-
      Reconcile the residual doc/impl drift recorded by the independent
      implementation review: (1) REQUIREMENTS claims additional read roots may
      be declared in configuration, but no config field exists, and
      BuildRequest.read_roots is documented as directories while
      build_context_grant silently skips anything that is not a file; (2)
      check_writable_scope checks only the top level while docs say the writable
      scope; (3) DESIGN says Ctrl+Up/Down scrolls while the UI binds plain
      Up/Down to both scrolling and prompt history; (4) emit_progress's doc
      comment calls a dropped sink non-fatal while the call propagates the
      error; (5) session_log's header claims only argument shapes are recorded
      while full argument values are written, and state_mutated is derived from
      output presence; (6) record_tool_result is documented redacted and bounded
      while only bounded is implemented; (7) cosmetic: leading-ellipsis
      truncation in summarize_path and context truncate/bounded_summary,
      MAX_SUMMARY_BYTES counting chars, the Debug effort label (Medium vs
      medium), the config search name agent-runner.toml versus the contract's
