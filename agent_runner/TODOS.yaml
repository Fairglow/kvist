  - id: "agent-runner-tui-progress-eta"
    title: Add a compaction progress bar with ETA
    description: >-
      Provide a bounded ETA for the compaction progress bar: forecast how long
      until the live context reaches the hard limit from the observed context
      growth rate, and show it when the estimate is meaningful (never fabricate a
      number when the growth is flat or unknown). Keep the existing compaction
      progress bar as the source of truth and surface the ETA only when it can be
      estimated reliably.
    context: >-
      The user explicitly requested "Progress bar, at least for compaction, with
      ETA (when possible)"; only the progress fraction exists today.
    purpose: Let the user anticipate an upcoming compaction and steer accordingly.
    expected_outcome: The UI shows a compaction ETA when estimable and hides it
      otherwise, with no speculative or misleading numbers.
    kind: implementation
    status: completed
