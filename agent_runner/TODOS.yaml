  - id: "agent-runner-context-compaction-hardening"
    title: Guarantee compaction keeps the live context under the limit
    description: >-
      Rework ContextManager::compact so it keeps as many of the most recent turns
      in full as fit under the hard limit_tokens, rolling the rest into the
      summary and reducing the number of full turns (flooring at the single most
      recent turn) until the estimated context is bounded. Previously a session
      with large turns could stay over the window and repeatedly send requests
      the model rejects. Add tests: compaction fits under the window while keeping
      recent turns in full, and reduces full turns (floor of one) when the window
      is tight.
    context: >-
      The user's central reliability requirement is that a long-running runner
      keeps working uninterrupted via reliable, bounded context. The prior
      compaction did not guarantee the result stayed under the window.
    purpose: Make long-duration sessions robust by guaranteeing a bounded live
      context after every compaction.
    expected_outcome: Compaction never leaves the estimated context at/over the
      limit when it can avoid it, always keeps the most recent turn, and the
      rolling summary stays bounded; covered by targeted tests.
    kind: implementation
    status: completed
    depends_on:
      - "agent-runner-session-implement-code"
    requirements:
      - "CONTRACT.md#ContextManager"
      - "REQUIREMENTS.md#Constraints"
    timestamps:
      created_at: "2026-09-19T13:10:00Z"
      updated_at: "2026-09-19T13:45:00Z"
      completed_at: "2026-09-19T13:45:00Z"
    blocked_reason: null
    recovery_state: null
