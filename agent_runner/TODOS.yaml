  - id: "agent-runner-llama-server-integration"
    title: Make llama-server integration first-class and decide on server launch
    description: >-
      Review the DirectModelTransport llama-server path (streaming, reasoning,
      tools, watchdogs, slot allocation) against the user's priority that this be
      first-class, reliable, and fully-featured, then harden any gaps. Resolve the
      open question of whether agent-runner should launch and supervise
      llama-server itself (to observe its progress/output) versus requiring it as
      an external dependency.
    context: >-
      The user named llama-server integration as the main focus and asked whether
      agent-runner can start llama-server ourselves to collect its progress.
    purpose: Deliver a reliable, fully-featured llama-server experience while
      preserving the headless, no-daemon default.
    expected_outcome: >-
      A documented decision (ADR 0010): require an externally supplied,
      externally supervised llama-server connected by the native DirectTransport,
      and do NOT launch or manage it (no daemon; optional supervised launch is a
      deferred, gated future decision). The streaming/watchdog paths are already
      implemented and covered by dedicated llama-server unary/streaming/watchdog
      tests in agent_runtime; progress is reported via the stats bar and preserved
      in the durable session log.
    kind: implementation
    status: completed
    depends_on:
      - "agent-runner-integration-write-tests"
