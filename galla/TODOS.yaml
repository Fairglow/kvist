  - id: transport-implement-code
    title: "implement_code: full-duplex bounded package-source transport"
    description: "Extract a private owned proxy with bounded concurrency, cancellable header/relay deadlines, bounded resolution and connect waits, independent directional buffers, and explicit error handling; retain source authorization and denied other tiers."
    context: >-
      Transport only; parent owns Cargo topology, protocol, cache and publication
      authority. Implementer-attributed validation, not independent certification:
      CARGO_TARGET_DIR=/opt/proj/kvist/.transport-target cargo test --offline --locked
      -p galla --lib enforcement::transport passed 21 tests, including three
      consecutive final parallel runs. With TMPDIR=/opt/proj/kvist/.transport-test-files
      and the same target, cargo test --offline --locked -p galla passed 155 tests
      and ignored two owned fixture entry points before the final four regressions;
      native system/Rust inventory trials ran and passed. Final cargo test --offline
      --locked -p galla --lib --test conformance --test scaffold passed 145 tests
      with the same two fixture entry points ignored. Final cargo clippy --offline
      --locked -p galla --all-targets -- -D warnings passed. rustfmt --check --edition
      2024 --config skip_children=true galla/src/enforcement.rs
      galla/src/enforcement/transport.rs galla/src/enforcement/transport_tests.rs
      and git diff --check -- galla passed. Scope remains socket transport;
      fixtures exchange TLS-shaped bytes, not certificate-authenticated TLS.
      Standard DNS helper cancellation and five-second in-flight connect limits
      remain documented; no installed-runner replacement or network-namespace
      redesign was performed. Independent review tasks remain pending.
    purpose: "Make authorized acquisition progress without serial blocking."
    expected_outcome: "Focused transport regressions and existing Galla tests pass."
    kind: implementation
    status: completed
    depends_on: [transport-write-tests]
