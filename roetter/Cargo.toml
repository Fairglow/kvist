[package]
name = "kvist-roetter"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
description = "Shared locked Rust dependency acquisition and offline readiness"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Fairglow/kvist"

[lib]
name = "roetter"

[dependencies]
sav = { package = "kvist-sav", version = "0.3", path = "../sav" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
hex = "0.4"
toml = "1.2"
semver = "1.0"
url = "2.5"
nix = { version = "0.31", default-features = false, features = ["fs"] }
tempfile = "3.27"
thiserror = "2.0"
