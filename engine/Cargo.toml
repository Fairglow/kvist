[package]
name = "kvist"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Stefan Lindblad"]
description = "Architecture-driven workflow and evidence for human-directed AI development"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Fairglow/kvist"
homepage = "https://github.com/Fairglow/kvist"
readme = "../README.md"

[workspace]
members = [".", "agent_runtime", "sandbox_runner"]
default-members = ["."]
resolver = "3"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
getrandom = "0.4"
nix = { version = "0.31", default-features = false, features = ["fs", "process", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.11"
tempfile = "3.27"
thiserror = "2.0"
hex = "0.4"
toml = "1.1"
toml_edit = "0.25.13"
agent-runtime = { version = "=0.1.0", path = "agent_runtime" }

[dev-dependencies]
kvist-sandbox-runner = { version = "=0.1.0", path = "sandbox_runner" }

[profile.dev]
debug = "line-tables-only"
