[package]
name = "supervised-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[lib]
name = "supervised_agent"

[[bin]]
name = "supervised-agent"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
nix = { version = "0.31", default-features = false, features = ["fs", "poll", "process", "signal"] }
signal-hook = "0.3"
tempfile = "3.27"
thiserror = "2.0"
toml_edit = "0.25.13"

[dev-dependencies]
tempfile = "3.27"
