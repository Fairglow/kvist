  - id: p2-02-security-audit
    title: Audit project status inspection boundaries
    description: Review component discovery reuse, bounded artifact reads, digest comparison, JSON serialization, path handling, and no-write behavior for unsafe acceptance or denial-of-service paths.
    context: Project status consumes untrusted filesystem and queue data that future execution will treat as an eligibility signal.
    purpose: Confirm that inspection cannot hide invalid workflow evidence, follow links, exceed resource limits, or mutate state while diagnosing projects.
    expected_outcome: An independent audit records findings or confirms the status inspection trust boundary before task selection consumes its result.
    kind: security-audit
    status: completed
