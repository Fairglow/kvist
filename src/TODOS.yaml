  - id: p2-03-write-tests
    title: Define task selection and transition tests
    description: Write focused integration tests for ready-task selection, revalidation gates, lifecycle and dependency completion, lock contention, atomic queue replacement, prepared/committed audit records, and cancellation recovery evidence.
    context: The validated queue has no executor, lock, writer, or durable attempt evidence, so later task automation could race or infer unsafe readiness.
    purpose: Establish executable evidence for the workflow-control boundary before any state transition can mutate a user-authored queue.
    expected_outcome: Focused tests initially fail for deterministic next-task output, stale and blocked refusal, illegal transitions, concurrent locks, preserved old queue on failed writes, and inspectable prepared records.
    kind: test
    status: completed
    depends_on: []
