    title: "Define project status inspection tests"
    description: "Write focused integration and unit tests for deterministic text and JSON status reports, artifact-state precedence, staleness causes, blocked queues, and read-only operation."
    context: "Root inspection validates only the root queue today, so scripts cannot determine whether a discovered component is missing, invalid, stale, blocked, or current."
    purpose: "Establish executable evidence for the project-wide inspection contract before the status implementation becomes the shared execution precondition."
    expected_outcome: "Focused tests initially fail for valid current components, malformed and unsupported component artifacts, local and parent revision mismatches, blocked tasks, stable report formats, and no-write inspection."
