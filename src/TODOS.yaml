tasks:
  - id: p2-01-write-tests
    title: Define TODO queue schema tests
    description: Write focused parser, serialization, dependency-graph, and task-state transition tests for the version-2 TODO queue contract before production implementation.
    context: Phase 1 accepted only an illustrative YAML list, so malformed task relationships and non-deterministic queue data could not be detected before future task execution.
    purpose: Establish executable evidence for the durable task-plan contract before any executor relies on it, preventing a weak parser from becoming the authority for workflow state.
    expected_outcome: The test suite expresses and initially fails for valid canonical queues, duplicate IDs, unknown dependencies, cycles, invalid transitions, malformed state metadata, and deterministic serialization.
    kind: test
    status: completed
    depends_on: []
    requirements:
      - ROOT_CONTRACT.md#Change-and-compliance-rules
      - SPEC.md#TODO-queue-schema-and-validation
      - TODO.md#P2-01
