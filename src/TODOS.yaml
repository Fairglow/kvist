    title: Implement task selection and atomic transitions
    description: Add the task CLI, readiness checks, lock protocol, atomic queue update, and append-only prepared/committed attempt records.
    context: Subsequent provider and test execution depends on one deterministic, auditable state mutation boundary.
    purpose: Prevent concurrent corruption and false completion while preserving durable recovery evidence.
    expected_outcome: A current tracked component can select one ready task and persist only legal transitions under the documented lock and audit protocol.
