  - id: p2-02-implement-code
    title: Implement project status inspection
    description: Add the shared read-only component inspection model, SHA-256 revalidation comparison, and versioned text and JSON status command.
    context: Future task selection and automation need one validated component state model rather than independent filesystem and queue interpretations.
    purpose: Make missing, invalid, unsupported, stale, blocked, and current component state deterministic and inspectable without mutating durable workflow state.
    expected_outcome: The status command reports every discovered component in stable text and JSON formats with attributable stale causes and preserves all inspected files.
    kind: implementation
    status: completed
    depends_on:
