[package]
name = "skott"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
authors = ["Stefan Lindblad"]
description = "First-class, sandbox-integrated interactive agent runner shell for Kvist"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Fairglow/kvist"
homepage = "https://github.com/Fairglow/kvist"
build = "build.rs"

[lib]
name = "skott"

[[bin]]
name = "skott"
path = "src/main.rs"

[[bin]]
name = "skott-file-tool"
path = "src/bin/file_tool.rs"

[dependencies]
sav = { version = "=0.3.0", path = "../sav" }
galla = { version = "=0.3.0", path = "../galla" }
clap = { version = "4.6", features = ["derive"] }
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm = "0.29"
tui-textarea-2 = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
sha2 = "0.11"
hex = "0.4"
nix = { version = "0.31", default-features = false, features = ["fs", "poll", "process", "signal", "term"] }
thiserror = "2.0"
tracing = "0.1"
# Private host-owned request staging outside the writable workspace.
tempfile = "3.27"
pulldown-cmark = "0.13"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "ansi"] }
csscolorparser = "0.6.2"

[dev-dependencies]
tempfile = "3.27"
serde_json = "1.0"
pulldown-cmark = "0.13"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
