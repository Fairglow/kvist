[package]
name = "kvist"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
getrandom = "0.4"
nix = { version = "0.29", default-features = false, features = ["fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3.15"
thiserror = "2.0"
toml = "1.0"

[profile.dev]
debug = "line-tables-only"
