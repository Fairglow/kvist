[package]
name = "kvist"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace]
members = [".", "src/supervised_agent"]
default-members = ["."]
resolver = "3"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
getrandom = "0.4"
nix = { version = "0.31", default-features = false, features = ["fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.11"
tempfile = "3.27"
thiserror = "2.0"
hex = "0.4"
toml = "1.1"
toml_edit = "0.25.13"
supervised-agent = { path = "src/supervised_agent" }

[profile.dev]
debug = "line-tables-only"
