[package]
name = "kvist-maerg"
version = "0.3.2"
edition = "2024"
rust-version = "1.95"
authors = ["Stefan Lindblad"]
description = "Architecture-driven workflow and evidence for human-directed AI development"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Fairglow/kvist"
readme = "README.md"

[lib]
name = "maerg"

[[bin]]
name = "kvist"
path = "src/main.rs"

[dependencies]
roetter = { package = "kvist-roetter", version = "0.3", path = "../roetter" }
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
crossterm = "0.29"
getrandom = "0.4"
nix = { version = "0.31", default-features = false, features = ["fs", "poll", "process", "signal", "term"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.11"
tempfile = "3.27"
thiserror = "2.0"
hex = "0.4"
toml = "1.2"
toml_edit = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "ansi"] }
sav = { package = "kvist-sav", version = "0.3", path = "../sav" }
skott = { package = "kvist-skott", version = "0.3", path = "../skott" }
reedline = "0.53"
terminal_size = "0.4"
blad = { package = "kvist-blad", version = "0.3", path = "../blad" }
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
unicode-segmentation = "1.13"
unicode-width = "0.2"
vte = "0.15"
pulldown-cmark = "0.13"

[dev-dependencies]
galla = { package = "kvist-galla", version = "0.3", path = "../galla" }
uuid = { version = "1.29", features = ["v4"] }
