[package]
name = "blad"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
authors = ["Stefan Lindblad"]
description = "Terminal Markdown viewer with optional Skott session support"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Fairglow/kvist"
homepage = "https://github.com/Fairglow/kvist"

[[bin]]
name = "blad"
path = "src/main.rs"

[lib]
name = "blad"
path = "src/lib.rs"

[features]
default = []
sessions = []

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
crossterm = "0.29"
pulldown-cmark = "0.13"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
unicode-segmentation = "1.13"
unicode-width = "0.2"
merman = { version = "=0.9.1", default-features = false, features = ["ascii", "diagram-flowchart", "diagram-sequence", "diagram-state", "diagram-class", "diagram-er"] }

[dev-dependencies]
tempfile = "3.27"
nix = { version = "0.31", default-features = false, features = ["fs", "poll", "process", "signal", "term"] }
vte = "0.15"
