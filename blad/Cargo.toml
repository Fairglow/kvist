[package]
name = "kvist-blad"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
authors = ["Stefan Lindblad"]
description = "A standalone terminal Markdown viewer with syntax highlighting, search, and text diagrams"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Fairglow/kvist"
homepage = "https://github.com/Fairglow/kvist/tree/main/blad"
documentation = "https://docs.rs/kvist-blad"
readme = "README.md"
keywords = ["markdown", "terminal", "viewer", "tui", "cli"]
categories = ["command-line-utilities", "text-processing"]
include = ["src/**", "tests/**", "docs/**", "ci/verify_package.py", "README.md", "CHANGELOG.md", "LICENSE"]

[[bin]]
name = "blad"
path = "src/main.rs"

[lib]
name = "blad"
path = "src/lib.rs"

[features]
default = []
sessions = ["dep:rustix"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
crossterm = "0.29"
libc = "0.2"
rustix = { version = "1.1", features = ["fs"], optional = true }
pulldown-cmark = "0.13"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
unicode-segmentation = "1.13"
unicode-width = "0.2"
regex = { version = "1.13", default-features = false, features = ["std", "perf", "unicode"] }
merman = { version = "=0.9.1", default-features = false, features = ["ascii", "diagram-flowchart", "diagram-sequence", "diagram-state", "diagram-class", "diagram-er"] }

[dev-dependencies]
tempfile = "3.27"
nix = { version = "0.31", default-features = false, features = ["fs", "poll", "process", "signal", "term"] }
vte = "0.15"
