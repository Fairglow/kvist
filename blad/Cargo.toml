[package]
name = "blad"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
authors = ["Stefan Lindblad"]
description = "First-class Markdown-native transcripts for agent sessions"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Fairglow/kvist"
homepage = "https://github.com/Fairglow/kvist"

[[bin]]
name = "blad"
path = "src/main.rs"

[lib]
name = "blad"
path = "src/lib.rs"

[dependencies]
sav = { version = "=0.3.0", path = "../sav" }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tempfile = "3.27"
chrono = "0.4"
crossterm = "0.29"
