  - id: blad-table-compliance-review
    title: "compliance_review: independent observed table evidence"
    description: "Derive an observed record in a clean context, then compare it to intent in a separate source-blind context."
    purpose: "Preserve independent evidence and human arbitration"
    expected_outcome: "Observed behavior and discrepancies documented without self-certification"
    kind: compliance-review
    context: |-
      Independent table-observer derived the scoped IMPL.md supplement solely
      from source/tests, excluding intent, queues, prior records/reviews and Git.
      Its independent runs passed 5 solver, 17 table-rendering and 5 viewer tests.
      Separate table-intent-comparison read only local intent and that supplement,
      plus author execution evidence; it inspected no source or test source.
      The comparison found scoped support for R-029 through R-032, not general
      proof, human acceptance, or whole-component certification.

      Findings retained for human arbitration:
      - The exact objective is minimax row height when fitting, otherwise minimum
        width followed by maximum row height; total height is not optimized.
      - The visual guarantee assumes the fixed 1:2 terminal-cell font model.
      - Prepared cells preserve newlines, but parser Text events normalize them;
        the mapping of every intended explicit break is not established by the
        observation. Hard-break events and br variants have a preserving path.
      - Unicode examples and the character-based PTY model do not prove general
        grapheme/terminal correctness.
