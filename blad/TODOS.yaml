  - id: blad-table-text-compliance-review
    title: "compliance_review: independent text-bound evidence"
    description: "Derive a clean source/test observation and compare it to corrected intent in a separate source-blind context."
    purpose: "Preserve independent evidence and human arbitration"
    expected_outcome: "Observed behavior and any discrepancies retained without acceptance claims"
    kind: compliance-review
    context: |
      Independent text-table-observer derived the 2026-10-21 IMPL.md supplement
      from allowed source and tests, excluding intent, queue, prior records,
      reviews and Git. Its runs passed 7 solver, 18 table-rendering and 5 PTY
      viewer tests. The architecture fixture remained opaque to the observer.

      Separate source-blind text-table-intent-comparison compared only current
      local intent, that supplement and supplied execution evidence. It found
      support for per-cell occupied-text floors, each cell's natural exemption,
      independent column caps, zero-width empty columns, exact minimax search,
      minimum-width overflow and the actual Component Model regression.
      Empty explicit lines still affect rendered height and minimax feasibility,
      not the aspect floor; this was found consistent with the corrected intent.
      No concrete scoped intent/evidence discrepancy was identified.

      Finite enumeration and summarized coverage are not universal proof, and
      physical-terminal Unicode behavior remains outside the evidence. These
      limits are retained without asserting safety, human acceptance or
      whole-component compliance. Earlier table observations remain historical.

      Author verification passed all 81 Blad tests, strict Clippy, Skott
      consumer compilation, workspace formatting and whitespace checks.
    status: completed
    depends_on: [blad-table-text-security-audit]
